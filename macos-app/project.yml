name: AtlasMasaMacOS
options:
  bundleIdPrefix: com.atlasmasa
settings:
  base:
    SWIFT_VERSION: 5.10
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages: {}
targets:
  AtlasMasaMacOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AtlasMasaMacOS/Sources
      - path: AtlasMasaMacOS/AtlasMasaMacOS.icns
        buildPhase: resources
    info:
      path: AtlasMasaMacOS/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        CFBundleIconFile: AtlasMasaMacOS
        LSApplicationCategoryType: public.app-category.business
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: AtlasMasaMacOS/AtlasMasaMacOS.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasmasa.macos
        DEVELOPMENT_TEAM: BW93SGS88H
  AtlasMasaMacOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AtlasMasaMacOS/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasmasa.macos.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AtlasMasaMacOS
