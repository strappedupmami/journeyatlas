repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-files
          - (^|/)(package-lock\.json|Cargo\.lock)$

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo-fmt
        entry: bash -lc 'cd atlas-concierge && cargo fmt --all --check'
        language: system
        pass_filenames: false

      - id: cargo-check
        name: cargo-check
        entry: bash -lc 'cd atlas-concierge && cargo check --workspace --locked'
        language: system
        pass_filenames: false

      - id: cargo-clippy
        name: cargo-clippy
        entry: bash -lc 'cd atlas-concierge && cargo clippy --workspace --all-targets -- -D warnings'
        language: system
        pass_filenames: false

      - id: cargo-audit
        name: cargo-audit
        entry: bash -lc 'cd atlas-concierge && cargo audit --deny warnings'
        language: system
        pass_filenames: false

      - id: verify-lockfiles
        name: verify-lockfiles
        entry: ./scripts/verify-lockfiles.sh presence
        language: system
        pass_filenames: false

      - id: verify-actions-pinning
        name: verify-actions-pinning
        entry: ./scripts/verify-github-actions-pinning.sh
        language: system
        pass_filenames: false

      - id: verify-workflow-trust-boundaries
        name: verify-workflow-trust-boundaries
        entry: ./scripts/verify-workflow-trust-boundaries.sh
        language: system
        pass_filenames: false
